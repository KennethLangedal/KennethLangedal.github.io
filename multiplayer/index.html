<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="referrer" content="no-referrer">
    <title>Yatzy with friends</title>
    <link rel="stylesheet" href="/shared/styles.css">
    <link rel="stylesheet" href="/multiplayer/style.css">
</head>
<body>
    <p id="message" role="status" aria-live="polite"></p>
    <section id="lobby">
        <form id="setup">
            <h1 id="lobby-title">Play with friends</h1>
            <label>Your name<input id="name" maxlength="24" required autocomplete="nickname"></label>
            <label id="variant-label">Game<select id="variant"><option value="maxi">Maxi Yatzy</option><option value="yatzy">Yatzy</option><option value="yahtzee">Yahtzee</option></select></label>
            <label id="player-count-label">Players<select id="player-count"><option value="2">2 players</option><option value="3">3 players</option><option value="4">4 players</option><option value="5">5 players</option></select></label>
            <button id="submit" type="submit">Create private room</button>
            <p id="setup-note">Choose 2–5 players, then share the invite link. The game starts when everyone has joined.</p>
            <a href="https://kennethlangedal.github.io/maxi/">Play solo</a>
        </form>
    </section>
    <section id="game" hidden>
        <div id="sheet-wrap">
            <table id="sheet">
                <thead><tr>
                    <th id="brand"><a href="https://kennethlangedal.github.io/">Kenneth Langedal</a><span id="variant-name"><span id="game-title">Maxi Yatzy</span></span></th>
                    <th id="player-0">Player</th><th id="player-1">Friend</th>
                </tr></thead>
                <tbody id="scores"></tbody>
            </table>
        </div>
        <div id="offline" role="status">
            <span id="connection">Connecting…</span><span id="turn"></span>
            <button id="open-analysis" type="button" hidden>Game breakdown</button>
            <button id="replay" type="button" hidden disabled>Play again</button>
            <a id="new-game" href="/multiplayer/" hidden>New room</a>
        </div>
        <div id="invite" hidden>
            <label>Invite your friends<input id="invite-url" readonly></label>
            <button id="copy" type="button">Copy invite link</button>
        </div>
        <div id="rolls">
            <span><span id="roll-name-0">Player</span> rolls <b id="chips-0"></b></span>
            <span><span id="roll-name-1">Friend</span> rolls <b id="chips-1"></b></span>
        </div>
        <div id="dice" aria-label="Dice"></div>
        <button id="roll" type="button" disabled>Roll Dice</button>
    </section>
    <div id="analysis" hidden></div>
    <script src="/shared/rules.js"></script>
    <script src="/shared/config.js"></script>
    <script src="/multiplayer/analysis.js"></script>
    <script src="/multiplayer/client.js"></script>
</body>
</html>
