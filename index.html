<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Yatzy Solver</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- The score rows, the dice and the roll chips are all built in game.js. -->
    <div id="sheet-wrap">
        <table id="sheet">
            <thead>
                <tr>
                    <th><label><input type="checkbox" id="ev-toggle">Show EV</label></th>
                    <th id="th-human">Player</th>
                    <th id="th-robot">Robot</th>
                </tr>
            </thead>
            <tbody id="rows"></tbody>
        </table>
    </div>

    <div id="offline" hidden>Solver unreachable &mdash; EV unavailable and the robot is
        playing without it. Your own score is unaffected.</div>

    <div id="rolls">
        <span>Player rolls <b id="human-chips"></b></span>
        <span>Robot rolls <b id="robot-chips"></b></span>
    </div>

    <div id="dice"></div>

    <div id="ev-panel" hidden>
        <div><small>Current hold</small><strong id="cur-ev">-</strong></div>
        <div><small>Best hold</small><strong id="best-ev">-</strong><span id="best-dice"></span></div>
        <button id="best-btn">Select best hold</button>
    </div>

    <button id="roll">Roll Dice</button>

    <div id="analysis" hidden></div>

    <script src="data.js"></script>
    <script src="analysis.js"></script>
    <script src="game.js"></script>
</body>

</html>
